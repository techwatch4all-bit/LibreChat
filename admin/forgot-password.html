<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satchida Admin - Reset Password</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Satchida Admin</h1>
    <p class="subtitle" id="subtitle">Operator account password reset</p>

    <!-- Step 1: request the challenge question -->
    <section id="step1" class="form-step">
      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required />
      </label>
      <button type="submit" id="requestBtn">Send challenge</button>
      <p id="requestError" class="error" hidden></p>
    </section>

    <!-- Step 2: solve the challenge and set a new password -->
    <section id="step2" class="form-step" hidden>
      <label>
        <span>Challenge question</span>
        <input type="text" id="challengeQuestion" readonly />
      </label>
      <label>
        <span>Your answer</span>
        <input type="text" name="challengeAnswer" autocomplete="one-time-code" required />
      </label>
      <label>
        <span>New password</span>
        <input type="password" name="newPassword" autocomplete="new-password" required />
      </label>
      <label>
        <span>Confirm password</span>
        <input type="password" name="confirmPassword" autocomplete="new-password" required />
      </label>
      <button type="submit" id="resetBtn">Reset password</button>
      <p id="resetError" class="error" hidden></p>
    </section>

    <!-- Result state -->
    <section id="result" class="form-step" hidden>
      <p class="empty" id="resultMsg"></p>
    </section>

    <p class="foot">
      Already have an account? <a href="./login.html">Back to sign in</a>.
    </p>
  </main>

  <script>
    // Pre-auth flow: no operator JWT yet, so requests are unauthenticated.
    // The challenge question is an operator-configured gate, so submitting an
    // email reveals nothing about whether the account exists.
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const result = document.getElementById('result');
    const requestBtn = document.getElementById('requestBtn');
    const resetBtn = document.getElementById('resetBtn');
    const requestError = document.getElementById('requestError');
    const resetError = document.getElementById('resetError');
    const resultMsg = document.getElementById('resultMsg');
    const challengeQuestion = document.getElementById('challengeQuestion');

    function showError(el, msg) {
      el.textContent = msg;
      el.hidden = false;
    }

    function hideError(el) {
      el.textContent = '';
      el.hidden = true;
    }

    async function api(path, body) {
      const res = await fetch('/api/admin' + path, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const json = res.status === 204 ? null : await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, json };
    }

    step1.querySelector('button').addEventListener('click', async (e) => {
      e.preventDefault();
      hideError(requestError);
      const email = step1.email.value.trim();
      if (!email) {
        showError(requestError, 'Please enter your email address.');
        return;
      }
      requestBtn.disabled = true;
      const { ok, status, json } = await api('/forgot-password', { email });
      requestBtn.disabled = false;

      if (status === 404 && json?.error_code === 'RESET_NOT_CONFIGURED') {
        showError(requestError, 'Password reset is not enabled on this server.');
        return;
      }
      if (!ok) {
        showError(requestError, json?.message || json?.error || 'Could not request a reset.');
        return;
      }

      // Gate armed: store the email and step to the challenge form.
      sessionStorage.setItem('resetEmail', email);
      challengeQuestion.value = json.challengeQuestion || json.message || '';
      step1.hidden = true;
      step2.hidden = false;
    });

    step2.querySelector('button').addEventListener('click', async (e) => {
      e.preventDefault();
      hideError(resetError);
      const email = sessionStorage.getItem('resetEmail') || '';
      const challengeAnswer = step2.challengeAnswer.value;
      const newPassword = step2.newPassword.value;
      const confirmPassword = step2.confirmPassword.value;

      if (!challengeAnswer) {
        showError(resetError, 'Please answer the challenge question.');
        return;
      }
      if (newPassword.length < 8) {
        showError(resetError, 'New password must be at least 8 characters.');
        return;
      }
      if (newPassword !== confirmPassword) {
        showError(resetError, 'Passwords do not match.');
        return;
      }

      resetBtn.disabled = true;
      const { ok, status, json } = await api('/reset-password', {
        email,
        challengeAnswer,
        newPassword,
      });
      resetBtn.disabled = false;

      if (status === 403) {
        showError(resetError, 'Challenge answer does not match.');
        return;
      }
      if (status === 400) {
        showError(resetError, json?.message || json?.error || 'Invalid input.');
        return;
      }
      if (!ok) {
        showError(resetError, json?.message || json?.error || 'Could not reset the password.');
        return;
      }

      sessionStorage.removeItem('resetEmail');
      step1.hidden = true;
      step2.hidden = true;
      resultMsg.textContent = json?.message || 'Password has been reset. You can sign in again.';
      result.hidden = false;
    });

    // Allow stepping back to the email entry if the gate has not been satisfied.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        step1.hidden = false;
        step2.hidden = true;
        result.hidden = true;
        sessionStorage.removeItem('resetEmail');
      }
    });
  </script>
</body>
</html>
