<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Satchida Admin - Login</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Satchida Admin</h1>
    <p class="subtitle">Operator account login</p>
    <form id="loginForm" autocomplete="off">
      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" id="submitBtn">Sign in</button>
      <p id="errorMsg" class="error" hidden></p>
    </form>
    <p class="foot">
      <a href="./forgot-password.html">Forgot your password?</a> ·
      Already logged in to Satchida? Visit <a href="./index.html">the dashboard</a>.
    </p>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      errorMsg.hidden = true;
      try {
        const res = await fetch('/api/admin/login/local', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.email.value.trim(),
            password: form.password.value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || data.error || 'Login failed');
        // `/login/local` returns a short-lived operator JWT in the body. The server's
        // session cookie is flagged `Secure; SameSite=Strict`, so it is NOT transmitted
        // when this panel is served over plain HTTP on the host. Keep the token in
        // sessionStorage and send it as `Authorization: Bearer` on every request.
        if (data.token) {
          sessionStorage.setItem('token', data.token);
        } else {
          throw new Error('No token returned by login');
        }
        location.href = './index.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.hidden = false;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
