<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="theme-color" content="#060816" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Satchida — local-first AI infrastructure"
    />
    <title>Satchida</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/satchida/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/satchida/favicon-16.png" />
    <link rel="apple-touch-icon" href="assets/satchida/icon-192x192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #loading-container {
        position: relative;
        display: grid;
        min-height: 100vh;
        overflow: hidden;
        place-items: center;
        isolation: isolate;
      }
      #loading-container[data-theme^='satchida-'] {
        background: var(--loader-background, #060816);
      }
      .satchida-loader-mesh {
        position: absolute;
        z-index: -1;
        inset: -10%;
        background:
          radial-gradient(circle at 16% 20%, rgba(165, 243, 252, 0.14), transparent 22%),
          radial-gradient(circle at 82% 14%, rgba(96, 165, 250, 0.18), transparent 24%),
          radial-gradient(circle at 68% 84%, rgba(56, 189, 248, 0.14), transparent 28%),
          linear-gradient(180deg, #060816 0%, #0b1333 38%, #12245a 72%, #173474 100%);
        animation: mesh-drift 24s ease-in-out infinite alternate;
      }
      [data-theme='satchida-light'] .satchida-loader-mesh {
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.9), transparent 24%),
          radial-gradient(circle at 82% 16%, rgba(125, 211, 252, 0.42), transparent 26%),
          radial-gradient(circle at 68% 80%, rgba(96, 165, 250, 0.24), transparent 28%),
          linear-gradient(180deg, #eff6ff 0%, #dbeafe 34%, #bfdbfe 100%);
      }
      .satchida-loader-content {
        display: grid;
        justify-items: center;
        gap: 1.25rem;
      }
      .satchida-loader-mark {
        position: relative;
        display: grid;
        width: min(64vw, 18rem);
        aspect-ratio: 1;
        place-items: center;
        isolation: isolate;
      }
      .satchida-loader-mark::before,
      .satchida-loader-mark::after {
        position: absolute;
        inset: 6%;
        border-radius: 50%;
        content: '';
        pointer-events: none;
      }
      .satchida-loader-mark::before {
        z-index: -1;
        background: radial-gradient(circle, rgba(61, 127, 181, 0.4) 0%, transparent 66%);
        animation: breathe 3.6s ease-in-out infinite;
      }
      .satchida-loader-mark::after {
        z-index: -1;
        background: radial-gradient(circle, transparent 42%, rgba(120, 190, 255, 0.16) 52%, rgba(140, 205, 255, 0.42) 62%, rgba(120, 190, 255, 0.1) 74%, transparent 88%);
        animation: pulse 3.6s cubic-bezier(0.4, 0, 0.35, 1) infinite;
      }
      .satchida-loader-mark img {
        width: 88%;
        height: 88%;
        object-fit: contain;
      }
      .satchida-loader-sweep {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 1px solid rgba(120, 190, 255, 0.12);
        border-radius: 1.5rem;
        pointer-events: none;
      }
      .satchida-loader-sweep::after {
        position: absolute;
        inset: -50%;
        background: conic-gradient(from 0deg, transparent 0deg 240deg, rgb(255 255 255 / 8%) 280deg, rgb(255 255 255 / 65%) 350deg, transparent 360deg);
        content: '';
        animation: sweep-spin 5s linear infinite;
      }
      .satchida-loader-wordmark {
        width: min(68vw, 21.25rem);
      }
      .satchida-loader-wordmark-light { display: none; }
      [data-theme='satchida-light'] .satchida-loader-wordmark-dark { display: none; }
      [data-theme='satchida-light'] .satchida-loader-wordmark-light { display: block; }
      @keyframes mesh-drift {
        from { transform: translate3d(-1.5%, -1%, 0) scale(1.02); }
        to { transform: translate3d(1.5%, 1%, 0) scale(1.06); }
      }
      @keyframes pulse {
        0% { transform: scale(0.12); opacity: 0; }
        12% { opacity: 0.9; }
        70% { opacity: 0.24; }
        100% { transform: scale(1.15); opacity: 0; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.26; }
      }
      @keyframes sweep-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .satchida-loader-mesh,
        .satchida-loader-mark::before,
        .satchida-loader-mark::after,
        .satchida-loader-sweep::after { animation: none; }
      }
    </style>
    <script>
      let theme = 'satchida-dark';
      try {
        theme = localStorage.getItem('color-theme') || theme;
      } catch (e) {
        /* Web Storage denied by browser policy: the shell falls back to the system theme. */
      }
      const loadingContainer = document.getElementById('loading-container');
      if (loadingContainer && (theme === 'satchida-dark' || theme === 'satchida-light')) {
        loadingContainer.dataset.theme = theme;
        loadingContainer.innerHTML = `
          <div class="satchida-loader-mesh"></div>
          <div class="satchida-loader-content" role="status" aria-label="Loading Satchida">
            <div class="satchida-loader-mark">
              <img src="/assets/satchida/satchida-splash-mandala.png?v=clean4" alt="" />
              <div class="satchida-loader-sweep"></div>
            </div>
            <img class="satchida-loader-wordmark satchida-loader-wordmark-dark" src="assets/satchida/satchida-splash-wordmark-dark.png" alt="Satchida" />
            <img class="satchida-loader-wordmark satchida-loader-wordmark-light" src="assets/satchida/satchida-splash-wordmark.png" alt="Satchida" />
          </div>`;
      }
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'satchida-dark') {
        backgroundColor = '#060816';
      } else if (theme === 'satchida-light') {
        backgroundColor = '#eff6ff';
      } else if (theme === 'high-contrast-dark') {
        backgroundColor = '#000000';
      } else if (theme === 'high-contrast-light') {
        backgroundColor = '#ffffff';
      } else if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
      } else {
        /* `system`, and anything unset or unrecognised, which ThemeProvider also
         * resolves as `system`. The OS decides the scheme and the contrast, and
         * a contrast request moves the dark canvas to pure black, so keying off
         * the scheme alone would flash #0d0d0d behind the black palette.
         * The three contrast queries mirror ThemeProvider's `CONTRAST_QUERIES`:
         * a Windows Contrast Theme reports `forced-colors: active` with
         * `prefers-contrast: custom`, never `more`. */
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const prefersMoreContrast = [
          '(prefers-contrast: more)',
          '(prefers-contrast: custom)',
          '(forced-colors: active)',
        ].some(function (query) {
          return window.matchMedia(query).matches;
        });
        backgroundColor = prefersDarkScheme
          ? prefersMoreContrast
            ? '#000000'
            : '#0d0d0d'
          : '#ffffff';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script>
      (function () {
        var KEY = 'lc-asset-recovery-at';
        var RUM_QUEUE_KEY = 'lc-rum-queue';
        var MAX_RUM_QUEUE = 20;
        window.__lcRumRecoveryGuardInstalled = true;
        window.__lcRumQueue = Array.isArray(window.__lcRumQueue) ? window.__lcRumQueue : [];
        try {
          var persistedQueue = JSON.parse(sessionStorage.getItem(RUM_QUEUE_KEY) || '[]');
          if (Array.isArray(persistedQueue)) {
            window.__lcRumQueue = persistedQueue.concat(window.__lcRumQueue).slice(-MAX_RUM_QUEUE);
          }
        } catch (e) {
          /* Diagnostics should never affect application startup. */
        }
        window.__lcRumPush = function (type, attributes) {
          try {
            var safeAttributes = {};
            Object.keys(attributes || {}).forEach(function (key) {
              var value = attributes[key];
              if (
                typeof value !== 'string' &&
                typeof value !== 'number' &&
                typeof value !== 'boolean'
              ) {
                return;
              }
              safeAttributes[key] = value;
            });
            /* Stamp before persistence: a recovery reload may precede the RUM module. */
            safeAttributes.clientBuildId = 'unknown';
            var entryScripts = document.querySelectorAll('script[type="module"][src]');
            for (var i = 0; i < entryScripts.length; i++) {
              var filename = entryScripts[i]
                .getAttribute('src')
                .split(/[?#]/, 1)[0]
                .split('/')
                .pop();
              if (/^index[.-][\w-]+\.js$/.test(filename)) {
                safeAttributes.clientBuildId = filename;
                break;
              }
            }
            if (window.__lcRumQueue.length >= MAX_RUM_QUEUE) {
              window.__lcRumQueue.shift();
            }
            window.__lcRumQueue.push({
              type: type,
              at: Math.round(performance.now()),
              visibilityState: document.visibilityState,
              attributes: safeAttributes,
            });
            sessionStorage.setItem(RUM_QUEUE_KEY, JSON.stringify(window.__lcRumQueue));
          } catch (e) {
            /* Diagnostics should never affect application startup. */
          }
        };
        function shouldRecover() {
          try {
            var last = Number(sessionStorage.getItem(KEY)) || 0;
            if (Date.now() - last < 60000) {
              return false;
            }
            sessionStorage.setItem(KEY, String(Date.now()));
            return true;
          } catch (e) {
            return false;
          }
        }
        window.__lcRecoverStaleAssets = function () {
          if (!shouldRecover()) {
            return false;
          }
          window.__lcRumPush('stale-asset-recovery-start');
          var reload = function () {
            window.__lcRumPush('stale-asset-recovery-reload');
            window.location.reload();
          };
          if (navigator.serviceWorker) {
            var scopeBase = new URL('./', document.baseURI || window.location.href).href;
            navigator.serviceWorker
              .getRegistrations()
              .then(function (registrations) {
                return Promise.all(
                  registrations
                    .filter(function (registration) {
                      return registration.scope.indexOf(scopeBase) === 0;
                    })
                    .map(function (registration) {
                      return registration.unregister();
                    }),
                );
              })
              .then(reload, reload);
          } else {
            reload();
          }
          return true;
        };
        if (navigator.serviceWorker) {
          navigator.serviceWorker.addEventListener('message', function (event) {
            if (!event.data || event.data.type !== 'LC_SW_PING') {
              return;
            }
            var source = event.source || navigator.serviceWorker.controller;
            if (source) {
              source.postMessage({ type: 'LC_SW_PONG' });
            }
          });
        }
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || !el.tagName) {
              return;
            }
            var failedScript = el.tagName === 'SCRIPT' && el.src;
            var failedPreload =
              el.tagName === 'LINK' && /preload/.test(el.rel || '') && /\.js$/.test(el.href || '');
            if (failedScript || failedPreload) {
              var isRumBootstrap = el.getAttribute('data-lc-rum-bootstrap') === 'true';
              window.__lcRumPush('asset-load-error', {
                tagName: el.tagName,
                assetUrl: el.src || el.href,
                optional: isRumBootstrap,
              });
              if (isRumBootstrap) {
                return;
              }
              window.__lcRecoverStaleAssets();
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var message = event.reason && event.reason.message;
          if (
            typeof message === 'string' &&
            (message.indexOf('dynamically imported module') !== -1 ||
              message.indexOf('Importing a module script failed') !== -1)
          ) {
            window.__lcRumPush('dynamic-import-error');
            window.__lcRecoverStaleAssets();
          }
        });
      })();
    </script>
    <script
      data-lc-rum-bootstrap="true"
      type="module"
      src="/src/lib/rum/bootstrap-entry.js"
    ></script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
  </body>
</html>
