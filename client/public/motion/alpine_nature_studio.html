<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Alpine River Valley — First Person View</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090d16;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    max-width: 960px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  }
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid #1f2937;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title { font-size: 1.1rem; font-weight: 600; color: #f8fafc; }
  .badge {
    background: #065f46;
    color: #6ee7b7;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 9999px;
    font-weight: 500;
  }
  .viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
  }
  .viewport img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: panZoom 18s ease-in-out infinite alternate;
  }
  @keyframes panZoom {
    0% { transform: scale(1) translate(0, 0); }
    50% { transform: scale(1.08) translate(-1.5%, -1%); }
    100% { transform: scale(1.05) translate(1.5%, 0.5%); }
  }
  .controls {
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    background: #0f172a;
    border-top: 1px solid #1f2937;
    flex-wrap: wrap;
  }
  .btn {
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }
  .btn:hover { background: #2563eb; }
  .btn-secondary { background: #334155; }
  .btn-secondary:hover { background: #475569; }
  .status { font-size: 0.85rem; color: #94a3b8; margin-left: auto; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title">🏔️ Alpine River Valley — First Person Panoramic Scene</div>
    <div class="badge">🔒 Local Sovereign (SD1.5 + ComfyUI)</div>
  </div>
  <div class="viewport">
    <img id="scene-img" src="/generated/local_image_f6d9fa37.png" alt="Alpine River Valley"/>
  </div>
  <div class="controls">
    <button class="btn" id="audio-toggle" onclick="toggleAudio()">🔊 Play Ambient Sound</button>
    <a href="/generated/local_image_f6d9fa37.png" download class="btn btn-secondary">⬇ Download 1080p Still</a>
    <a href="/comfyui/" target="_blank" class="btn btn-secondary">🎛 Open Integrated ComfyUI</a>
    <div class="status" id="audio-status">Ambience: Paused</div>
  </div>
</div>

<script>
  let audioCtx = null;
  let isPlaying = false;
  let noiseNode = null;
  let birdInterval = null;

  function toggleAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    isPlaying = !isPlaying;
    const btn = document.getElementById('audio-toggle');
    const status = document.getElementById('audio-status');
    
    if (isPlaying) {
      btn.textContent = '🔇 Pause Sound';
      status.textContent = 'Ambience: Flowing River & Mountain Pines';
      startNatureSound();
    } else {
      btn.textContent = '🔊 Play Ambient Sound';
      status.textContent = 'Ambience: Paused';
      stopNatureSound();
    }
  }

  function startNatureSound() {
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 450;
    filter.Q.value = 1.2;

    const gain = audioCtx.createGain();
    gain.gain.value = 0.18;

    whiteNoise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    whiteNoise.start();
    noiseNode = { src: whiteNoise, gain: gain };

    birdInterval = setInterval(() => {
      if (!isPlaying) return;
      playBirdChirp();
    }, 2800);
  }

  function playBirdChirp() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2600 + Math.random() * 800, now);
    osc.frequency.exponentialRampToValueAtTime(3400 + Math.random() * 600, now + 0.08);
    osc.frequency.exponentialRampToValueAtTime(2200, now + 0.15);
    g.gain.setValueAtTime(0.04, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  function stopNatureSound() {
    if (noiseNode) {
      try { noiseNode.src.stop(); } catch(e) {}
      noiseNode = null;
    }
    if (birdInterval) {
      clearInterval(birdInterval);
      birdInterval = null;
    }
  }
</script>
</body>
</html>
