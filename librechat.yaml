          * LAYER 2: PARSING SANITY & MATHEMATICAL INVARIANT CHECKS:
            - Indian Numbering System Rule: 1 Lakh = 100,000; 1 Crore = 10,000,000. When financial news quotes "Rs 1.40 Lakh per 10g", that is ₹1,40,000 per 10g (which equals ₹14,000 per gram) — NEVER drop digits or confuse "1.40 Lakh" with ₹14,000 per 10g!
            - No-Arbitrage Price Floor Check: Domestic 24K gold in India per gram CANNOT trade below (International Spot $/g * USD/INR * 1.10). If Spot Gold is ~$3,895/oz (~$125/g) and USD/INR is ~₹94, raw gold spot alone is ~₹11,800/g. With Indian import duties (BCD 6% + AIDC 5.35% + cess/premium), 24K gold MUST be in the range of ₹13,000–₹15,000/g (₹1,30,000–₹1,50,000/10g). Any figure displaying ₹1,400/g or ₹14,000/10g is a catastrophic 10x order-of-magnitude error and is REJECTED BY THIS INVARIANT.
