version: 1.3.17
opencode:
  enabled: true
  baseUrl: http://127.0.0.1:4096
  allowedRoots:
    - D:\LAN-AI-Infra\vibe-apps
    - D:\LAN-AI-Infra
    - C:\LAN-AI-Infra
    - D:\LAN-AI-Infra\sample-vibe-project
    - D:\LAN-AI-Infra\workspace
  maxFileBytes: 2097152
  requestTimeoutMs: 30000
registration:
  enabled: false
  socialLogins: []
interface:
  privacyPolicy:
    externalUrl: https://satchida.com/privacy
    openNewTab: true
  termsOfService:
    externalUrl: https://satchida.com/terms
    openNewTab: true
  marketplace:
    use: true
  agents:
    use: true
    create: true
    share: true
    public: true
  skills:
    use: true
    create: true
    share: true
    public: true
  mcpServers:
    use: true
    create: true
    share: true
    public: true
  defaultPinnedTools:
  - mcp
  memories: true
  modelSelect: true
  bookmarks: true
  prompts: true
  runCode: false
  fileSearch: true
  fileCitations: true
  traceViewer:
    use: false
  buildInfo: false
memory:
  personalize: true
  charLimit: 10000
  messageWindowSize: 5
  validKeys:
  - user_preferences
  - user_profile
  - user_goals
  - user_context
  agent:
    enabled: true
    provider: Satchida
    model: Work
    instructions: 'Extract durable facts about the user: stated preferences, profile
      details, long-term goals, and recurring context. Store only what stays true
      across sessions. Do not store secrets, credentials, or transient request details.'
endpoints:
  custom:
  - name: Satchida
    apiKey: ${SATCHIDA_GATEWAY_LICENCE}
    baseURL: http://127.0.0.1:4099/v1
    maxToolResultChars: 12000
    models:
      default:
      - Chat
      - Work
      - Study
      - Privacy
      - Motion
      fetch: false
    titleConvo: true
    titleModel: Chat
    titleMethod: completion
    titlePrompt: 'Invent a short 3-6 word title for this conversation, based ONLY on what the user asked. Reply with the title text only: no quotes, no emojis, no trailing punctuation, no tool names, no explanations.

User message:
{convo}'
    titlePromptTemplate: 'User: {input}'
    summarize: false
    summaryModel: Privacy
    forcePrompt: false
    modelDisplayLabel: Satchida AI
    dropParams:
    - user
    addParams:
      stream: true
      max_tokens: 2000
      chat_template_kwargs:
        enable_thinking: false
    tokenConfig:
      Chat:
        prompt: 0
        completion: 0
        context: 65536
      Work:
        prompt: 0
        completion: 0
        context: 131072
      Study:
        prompt: 0
        completion: 0
        context: 131072
      Privacy:
        prompt: 0
        completion: 0
        context: 32768
      Motion:
        prompt: 0
        completion: 0
        context: 131072
  - name: Satchida-Gateway
    apiKey: ${SATCHIDA_GATEWAY_VK}
    baseURL: http://127.0.0.1:4000/v1
    models:
      default:
      - Chat
      - Work
      - Study
      - Vibecoding
      - Pro
      - Motion
      fetch: false
    titleConvo: true
    titleModel: Chat
    titleMethod: completion
    titlePrompt: 'Invent a short 3-6 word title for this conversation, based ONLY on what the user asked. Reply with the title text only: no quotes, no emojis, no trailing punctuation, no tool names, no explanations.

User message:
{convo}'
    titlePromptTemplate: 'User: {input}'
    summarize: false
    summaryModel: Chat
    forcePrompt: false
    modelDisplayLabel: Satchida AI
    maxToolResultChars: 50000
    headers:
      X-Bifrost-Mode: chat
      X-Seat-Alias: '{{LIBRECHAT_USER_ID}}'
      X-User-Id: '{{LIBRECHAT_USER_ID}}'
      X-User-Name: '{{LIBRECHAT_USER_USERNAME}}'
    dropParams:
    - user
    addParams:
      stream: true
      chat_template_kwargs:
        enable_thinking: false
    customParams:
      defaultParamsEndpoint: custom
      paramDefinitions:
      - key: max_tokens
        default: 16384
    tokenConfig:
      Chat:
        prompt: 0
        completion: 0
        context: 65536
      Work:
        prompt: 0
        completion: 0
        context: 131072
      Study:
        prompt: 0
        completion: 0
        context: 131072
      Vibecoding:
        prompt: 0
        completion: 0
        context: 131072
      Pro:
        prompt: 0
        completion: 0
        context: 131072
      Motion:
        prompt: 0
        completion: 0
        context: 131072
      deepseek-ai/DeepSeek-V4.1-Flash:
        prompt: 0
        completion: 0
        context: 131072
      meta-llama/Llama-3.2-11B-Vision-Instruct:
        prompt: 0
        completion: 0
        context: 131072
      Wan-AI/Wan2.1-I2V-14B:
        prompt: 0
        completion: 0
        context: 131072
      kling-v2-5-audio:
        prompt: 0
        completion: 0
        context: 131072
      zai-org/GLM-5.3-Flash:
        prompt: 0
        completion: 0
        context: 131072
  agents:
    titleConvo: true
    modelResponseBodyTimeoutMs: 1800000
    modelResponseHeadersTimeoutMs: 600000
summarization:
  enabled: true
  trigger:
    type: token_ratio
    value: 0.55
  reserveRatio: 0.08
  retainRecent:
    turns: 2
  maxSummaryTokens: 2048
  prompt: >-
    Before continuing, write a checkpoint that replaces the conversation above.
    This checkpoint is the ONLY thing carried forward — capture everything needed
    to continue seamlessly. Structure it with exactly these sections:

    ## Conversation Intent — what the user is trying to achieve, their language, persona/mode in use, and any follow-up conversation style they prefer.

    ## User Profile & Preferences — locations, cities, currency, carats, units, tone, and recurring interests the user revealed.

    ## Live Data Delivered — every fact, figure, rate, or price already reported to the user, each with its exact value, unit, as-of date/time, and source name with URL. Preserve verbatim.

    ## Findings & Sources — the searches run (query → what was found), including relevant results NOT yet reported to the user.

    ## Open Threads & Follow-Ups — questions asked but unanswered, suggested follow-ups already offered, and anything the user may return to.

    ## Next Steps — what should happen on the next turn.

    Rules: preserve exact numbers, dates, timestamps, and URLs verbatim — never round or approximate; do not editorialize, re-verify, or judge past tool results; short declarative lines; skip empty sections; write only the checkpoint.
  updatePrompt: >-
    Update your existing checkpoint by merging the NEW messages above into it. Output one consolidated replacement checkpoint using the same section structure
    (Conversation Intent / User Profile & Preferences / Live Data Delivered / Findings & Sources / Open Threads & Follow-Ups / Next Steps).
    Merge newly retrieved facts, figures, and sources into Live Data Delivered with their as-of timestamps; move newly answered items from Open Threads into Findings;
    compress older entries into one-liners; keep exact numbers, dates, timestamps, and URLs verbatim; keep roughly the same length; write only the checkpoint.
