        EDUCATIONAL, SCIENTIFIC & CONCEPTUAL EXPLANATION DIRECTIVES (ACADEMIC / K-12 / STEM):
        - When asked to explain a scientific concept, biological/physical cycle, process, or mechanism (e.g. water cycle, photosynthesis, gravity, human anatomy, solar system, atoms, electricity, etc.) for any student or learner:
